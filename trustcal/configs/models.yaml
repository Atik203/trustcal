# The ONLY file that changes between the Four-bit (80/96GB) and Final (96GB)
# serving phases. The dev (48GB A6000) stack is retired: its 9-14B checkpoints
# were only for interface checks on the university slice, and both runnable
# phases are now tested.
#
# `model` is what vLLM serves AND what the OpenAI client sends — do not rename it
# on the server (`--served-model-name` caused 404s in the first serve.sh draft).
# serve.sh commands are generated from this file by scripts/gen_serve_cmds.py,
# so flags can never drift from this config again.

rounds: 3
max_model_len: 4096           # fallback for a phase that does not set its own
gpu_memory_utilization: 0.90  # sum of the three instances

# Four-bit phase (Ph 2b-3) runs on an 80GB card (A100/H100 class). Checkpoints
# and revisions pinned 2026-11-09 from the HF API. Repo totals are 21.04GB
# (Qwen AWQ), 17.23GB (Gemma AWQ) and 15.06GB (Mistral AWQ); budgeted weights
# are 21.0 + 17.2 + 15.06 = 53.26GB, so 80GB x 0.90 leaves ~18.7GB for KV
# cache and activations. scripts/check_stack.py --phase fourbit enforces the
# 80GB card budget.
#
# Per-instance utilization is deliberately asymmetric (0.33 / 0.29 / 0.28, sum
# 0.90). An equal 0.30 split leaves Qwen only ~3GB of KV because it carries the
# largest weights; that caps the panel at ~3 concurrent sequences and blocks
# 4-way concurrent rows. Shifting 2.4 points from Gemma/Mistral to Qwen raises
# Qwen's KV to ~5.4GB on 80GB (~11GB on 96GB) without changing the weight
# total or the 0.90 ceiling.
fourbit_phase:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  agents:
    - role: "agent1"
      model: "cyankiwi/Qwen3.8-27B-AWQ-INT4"
      revision: "e3a700906e6a73ba4290b1873dc2ba8198527ab5"
      port: 8000
      quant: "compressed-tensors"
      weights_gb: 21.0
      gpu_memory_utilization: 0.33
      max_model_len: 8192
      extra_args:
        - "--language-model-only"   # text-only debates: drop the vision tower
        - "--reasoning-parser"
        - "qwen3"
        - "--default-chat-template-kwargs"
        - '{"enable_thinking": false}'
    - role: "agent2"
      model: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
      revision: "5c5db8a7aeabb70b27923ef56536aa5343ecbb5b"
      port: 8001
      quant: "compressed-tensors"
      weights_gb: 17.2
      gpu_memory_utilization: 0.29
      max_model_len: 8192
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image": 0}'                 # 26B A4B is text+image; audio is not a modality
    - role: "agent3"
      model: "jeffcookio/Mistral-Small-3.2-24B-Instruct-2506-awq-sym"
      revision: "49ec31ec0975e46a1aeef24186a45f11be3042b8"
      port: 8002
      # Despite the repo name, this is llm-compressor pack-quantized
      # (quant_method=compressed-tensors), not AutoAWQ. Set it explicitly so a
      # detection miss cannot kill a paid startup.
      quant: "compressed-tensors"
      weights_gb: 15.06
      gpu_memory_utilization: 0.28
      max_model_len: 8192
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image": 0}'                 # drop the Pixtral vision path from text debates

# Final phase (Ph 3-5) runs on an RTX PRO 6000 Blackwell 96GB. Checkpoints and
# revisions pinned 2026-11-09 from the HF API. For Qwen `weights_gb` is the
# loaded conservative estimate: 26.93GB body + 2.54GB lm_head + 0.48GB MTP =
# 29.95GB; the 30.87GB FP8 repo also carries a 0.92GB vision tower, which
# --language-model-only drops. scripts/check_stack.py enforces the 96GB
# card budget (96 x 0.90 - 73.68 = 12.72GB budgeted KV).
# Offline preflight is `check_stack.py --phase final` then
# `HF_HUB_OFFLINE=1 python scripts/preflight.py --phase final --offline`;
# the real stack proof is `smoke_test.py --phase final` on the 96GB card.
final_phase:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  agents:
    - role: "agent1"
      model: "Qwen/Qwen3.8-27B-FP8"
      revision: "c3a462cc3d38cf351f3b26cbd763469eeb74ef81"
      port: 8000
      quant: "fp8"
      weights_gb: 29.95
      gpu_memory_utilization: 0.30
      max_model_len: 8192
      extra_args:
        - "--language-model-only"
        - "--reasoning-parser"
        - "qwen3"
        - "--default-chat-template-kwargs"
        - '{"enable_thinking": false}'
    - role: "agent2"
      model: "RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic"
      revision: "ed35d7abe5d940da41b4ff06eb482feb0be8cb44"
      port: 8001
      quant: "compressed-tensors"
      weights_gb: 28.67
      gpu_memory_utilization: 0.34
      max_model_len: 8192
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image": 0}'                 # 26B A4B is text+image; audio is not a modality
    - role: "agent3"
      model: "jeffcookio/Mistral-Small-3.2-24B-Instruct-2506-awq-sym"
      revision: "49ec31ec0975e46a1aeef24186a45f11be3042b8"
      port: 8002
      quant: "compressed-tensors"
      weights_gb: 15.06
      gpu_memory_utilization: 0.26
      max_model_len: 8192
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image": 0}'
